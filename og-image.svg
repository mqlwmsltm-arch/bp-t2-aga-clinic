<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00bcd4"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="481" cy="26" r="90" fill="#1565c0" opacity="0.09"/>
    <circle cx="980" cy="405" r="30" fill="#1565c0" opacity="0.16"/>
    <circle cx="97" cy="248" r="26" fill="#1565c0" opacity="0.11"/>
    <circle cx="50" cy="721" r="84" fill="#1565c0" opacity="0.11"/>
    <circle cx="1122" cy="717" r="48" fill="#1565c0" opacity="0.18"/>
    <circle cx="1009" cy="312" r="47" fill="#1565c0" opacity="0.09"/>
    <rect x="175" y="201" width="48" height="57" rx="8" fill="#0d47a1" opacity="0.11" transform="rotate(34, 227, 6)"/>
    <rect x="460" y="615" width="93" height="57" rx="8" fill="#0d47a1" opacity="0.09" transform="rotate(22, 1289, 485)"/>
    <rect x="853" y="331" width="54" height="50" rx="8" fill="#0d47a1" opacity="0.05" transform="rotate(32, 990, 174)"/>
    <rect x="5" y="358" width="69" height="67" rx="8" fill="#0d47a1" opacity="0.09" transform="rotate(20, 40, 418)"/>
    <rect x="80" y="303" width="80" height="25" rx="8" fill="#0d47a1" opacity="0.14" transform="rotate(12, 14, 726)"/>
    <rect x="1" y="295" width="73" height="45" rx="8" fill="#0d47a1" opacity="0.12" transform="rotate(23, -15, -59)"/>
    <rect x="1129" y="57" width="98" height="47" rx="8" fill="#0d47a1" opacity="0.04" transform="rotate(21, 1158, 542)"/>
    <rect x="978" y="-46" width="57" height="67" rx="8" fill="#0d47a1" opacity="0.05" transform="rotate(27, 407, 133)"/>
    <polygon points="354,184 405,286 303,286" fill="#1565c0" opacity="0.08"/>
    <polygon points="1197,112 1267,252 1127,252" fill="#1565c0" opacity="0.09"/>
    <polygon points="860,-66 888,-10 832,-10" fill="#1565c0" opacity="0.11"/>
    <polygon points="599,-31 622,15 576,15" fill="#1565c0" opacity="0.12"/>

  <!-- Wave at bottom -->
  <path d="M0,586 C360,608 840,564 1200,586 L1200,630 L0,630Z" fill="#1565c0" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    구글 신뢰 지수 모발이식 솔루션
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
     — 도메인 파워 증폭
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#00bcd4" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#00bcd4" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
     구글 신뢰 지수 모발이식 솔루션 — 도메인 파워 증폭
  </text>
</svg>